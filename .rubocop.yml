AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'bin/**/*'

Layout/LineLength:
  Max: 150

Metrics/MethodLength:
  Max: 35
  Exclude:
    - 'lib/active_postgres/configuration.rb'
    - 'lib/active_postgres/components/repmgr.rb'
    - 'lib/active_postgres/connection_pooler.rb'
    - 'lib/active_postgres/generators/active_postgres/install_generator.rb'
    - 'lib/active_postgres/performance_tuner.rb'
    - 'lib/active_postgres/ssh_executor.rb'
    - 'lib/active_postgres/health_checker.rb'
    - 'lib/active_postgres/overview.rb'
    - 'test/components/pgbouncer_test.rb'

Metrics/ClassLength:
  Max: 250
  Exclude:
    - 'lib/active_postgres/components/repmgr.rb'
    - 'lib/active_postgres/connection_pooler.rb'
    - 'lib/active_postgres/ssh_executor.rb'
    - 'lib/active_postgres/components/pgbouncer.rb'
    - 'lib/active_postgres/health_checker.rb'
    - 'lib/active_postgres/overview.rb'
    - 'test/components/pgbouncer_test.rb'

Metrics/AbcSize:
  Max: 40
  Exclude:
    - 'lib/active_postgres/components/repmgr.rb'
    - 'lib/active_postgres/connection_pooler.rb'
    - 'lib/active_postgres/generators/active_postgres/install_generator.rb'
    - 'lib/active_postgres/performance_tuner.rb'
    - 'lib/active_postgres/ssh_executor.rb'
    - 'lib/active_postgres/validator.rb'
    - 'lib/active_postgres/components/pgbouncer.rb'
    - 'lib/active_postgres/configuration.rb'
    - 'lib/active_postgres/health_checker.rb'
    - 'lib/active_postgres/overview.rb'

Metrics/CyclomaticComplexity:
  Max: 12
  Exclude:
    - 'lib/active_postgres/components/repmgr.rb'
    - 'lib/active_postgres/connection_pooler.rb'
    - 'lib/active_postgres/generators/active_postgres/install_generator.rb'
    - 'lib/active_postgres/configuration.rb'
    - 'lib/active_postgres/error_handler.rb'
    - 'lib/active_postgres/health_checker.rb'
    - 'lib/active_postgres/overview.rb'
    - 'test/test_helper.rb'

Metrics/PerceivedComplexity:
  Max: 12
  Exclude:
    - 'lib/active_postgres/components/repmgr.rb'
    - 'lib/active_postgres/connection_pooler.rb'
    - 'lib/active_postgres/generators/active_postgres/install_generator.rb'
    - 'lib/active_postgres/configuration.rb'
    - 'lib/active_postgres/error_handler.rb'
    - 'lib/active_postgres/health_checker.rb'
    - 'lib/active_postgres/overview.rb'
    - 'test/test_helper.rb'

Metrics/BlockLength:
  Enabled: false

Metrics/ParameterLists:
  Max: 6
  Exclude:
    - 'lib/active_postgres/ssh_executor.rb'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/FormatParameterMismatch:
  Exclude:
    - 'lib/active_postgres/performance_tuner.rb'

Naming/VariableNumber:
  Exclude:
    - 'test/components/pgbouncer_templates_test.rb'

Style/TrivialAccessors:
  Exclude:
    - 'test/components/pgbouncer_test.rb'

Style/CombinableLoops:
  Exclude:
    - 'lib/active_postgres/components/repmgr.rb'
